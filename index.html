<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Photobooth</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section id="page-home" class="active">
        <div class="content">
            <h1>Web Photobooth</h1>
            <button id="btn-start" onclick="goToCameraSelection()">Mulai Foto</button>
            <button id="btn-change-bg" onclick="changeBackground()">Ganti Background</button>
        </div>
    </section>

    <section id="page-camera">
        <div id="selection-overlay">
            <h2>Pilih Jumlah Foto:</h2>
            <button onclick="startCapture(3)">3 Foto</button>
            <button onclick="startCapture(4)">4 Foto</button>
            <button onclick="startCapture(6)">6 Foto</button>
        </div>

        <div id="camera-container" style="display:none;">
            <div class="camera-left">
                <video id="video" autoplay playsinline></video>
                <div id="timer"></div>
                <button id="btn-capture" disabled>Ambil Foto</button>
            </div>
            <div class="camera-right" id="preview-strip">
                </div>
        </div>
    </section>

    <section id="page-frame">
        <h2>Pilih Frame</h2>
        <div id="frame-options">
            </div>
        <canvas id="canvas-result" style="display:none;"></canvas>
        <button id="btn-download">Download Hasil</button>
    </section>

    <script src="script.js"></script>
</body>
</html>
