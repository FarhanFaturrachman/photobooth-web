<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DINA Photobooth</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section id="page-home" class="active">
        <div class="content-home">
            <h1>PHOTOBOOTH</h1>
            <p>HAPPY BIRTHDAY ADINA AHZAWATI FAKHIRA</p>
            <button id="btn-start" onclick="startCapture()">MULAI FOTO</button>
        </div>
    </section>

    <section id="page-camera">
        <div id="camera-container">
            <div class="camera-left">
                <div class="video-wrapper">
                    <video id="video" autoplay playsinline></video>
                    <div id="timer"></div>
                </div>
                <div class="controls">
                    <button id="btn-capture-manual" onclick="triggerManualCapture()">AMBIL FOTO</button>
                    <button id="btn-go-to-frame" style="display:none;" onclick="showFrameSelection()">LANJUT PILIH FRAME</button>
                </div>
            </div>
            <div class="camera-right">
                <h3>Hasil Foto</h3>
                <div id="preview-strip">
                    <div class="slot" id="slot-0" onclick="openDetail(0)"><span>1</span></div>
                    <div class="slot" id="slot-1" onclick="openDetail(1)"><span>2</span></div>
                    <div class="slot" id="slot-2" onclick="openDetail(2)"><span>3</span></div>
                    <div class="slot" id="slot-3" onclick="openDetail(3)"><span>4</span></div>
                </div>
            </div>
        </div>
    </section>

    <section id="page-frame">
        <div id="frame-options"></div>
        <div class="result-container">
            <img id="final-image-preview" style="display:none;">
            <div class="action-buttons">
                <button id="btn-download" style="display:none;">SIMPAN FOTO</button>
                <button onclick="location.reload()">KEMBALI</button>
            </div>
        </div>
        <canvas id="canvas-result" style="display:none;"></canvas>
    </section>

    <div id="photo-detail-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeDetail()">&times;</span>
            <img id="detail-img-view" src="">
            <div class="modal-controls">
                <button id="btn-confirm-retake">ULANGI FOTO INI</button>
                <div id="confirm-box" style="display:none;">
                    <p>Yakin ingin menghapus dan mengulang foto ini?</p>
                    <button id="btn-yes-retake" style="background:#ffa502; color:black;">YA, YAKIN</button>
                    <button onclick="closeDetail()" style="background:#555;">BATAL</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
