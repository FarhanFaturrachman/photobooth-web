<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Photobooth - Simple Version</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section id="page-home" class="active">
        <div class="content">
            <h1>Web Photobooth</h1>
            <button id="btn-start" onclick="startCapture(4)">Mulai Foto</button>
        </div>
    </section>

    <section id="page-camera">
        <div id="camera-container">
            <div class="camera-left">
                <div class="video-wrapper">
                    <video id="video" autoplay playsinline></video>
                    <div id="timer"></div>
                </div>
                <button id="btn-go-to-frame" style="display:none;" onclick="showFrameSelection()">Lanjut ke Pilih Frame</button>
            </div>
            <div class="camera-right" id="preview-strip">
                </div>
        </div>
    </section>

    <section id="page-frame">
        <h2>Pilih Frame</h2>
        <div id="frame-options"></div>
        <div class="result-container">
            <canvas id="canvas-result" style="display:none;"></canvas>
            <button id="btn-download" style="display:none;">Download Hasil</button>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
