<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Photobooth Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section id="page-home" class="active">
        <div class="content-home">
            <h1>WEB PHOTOBOOTH</h1>
            <p>Siapkan pose terbaikmu!</p>
            <button id="btn-start" onclick="startCapture(4)">MULAI FOTO</button>
        </div>
    </section>

    <section id="page-camera">
        <div id="camera-container">
            <div class="camera-left">
                <div class="video-wrapper">
                    <video id="video" autoplay playsinline></video>
                    <div id="timer"></div>
                </div>
                <div class="controls">
                    <button id="btn-go-to-frame" style="display:none;" onclick="showFrameSelection()">PILIH FRAME</button>
                    <button id="btn-retake" style="display:none;" onclick="location.reload()">FOTO ULANG</button>
                </div>
            </div>
            <div class="camera-right" id="preview-strip"></div>
        </div>
    </section>

    <section id="page-frame">
        <h2>Pilih Desain Frame</h2>
        <div id="frame-options"></div>
        <div class="result-container">
            <canvas id="canvas-result" style="display:none;"></canvas>
            <img id="final-image-preview" style="display:none; max-width: 300px; border: 5px solid white;">
            <br>
            <button id="btn-download" style="display:none;">SIMPAN FOTO</button>
            <button onclick="location.reload()" class="btn-secondary">KEMBALI</button>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
